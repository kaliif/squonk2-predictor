---
kind: DataManagerJobDefinition
kind-version: '2021.1'

name: Predict values using scikit-learn models
collection: im-predict-local

jobs:

  predict:
    name: Predict values
    description: >-
      Predicts values for molecules using a pre-trained scikit-learn model.
      The descriptors the model was trained on are calculated for the
      molecules. Supply probe molecules with known predictions to verify the
      model; without them the results are marked as unverified.
    version: '1.0.0'
    category: predict
    keywords:
    - predict
    - scikit-learn
    image:
      name: informaticsmatters/squonk2-predict-local
      tag: latest
      project-directory: /data
      working-directory: /data
      fix-permissions: true
    command: >-
      python /code/predict.py
      --model '{{ modelFile }}'
      --molecules '{{ inputFile }}'
      --outfile '{{ outputFile }}'
      {% if probesFile is defined %}--probes '{{ probesFile }}'{% endif %}
      {% if delimiter is defined %}--delimiter {{ delimiter }}{% endif %}
      {% if readHeader is defined and readHeader %}--read-header{% endif %}
    variables:
      order:
        options:
        - outputFile
        - delimiter
        - readHeader
      inputs:
        type: object
        required:
        - modelFile
        - inputFile
        properties:
          modelFile:
            title: Model (.jmodel)
            mime-types:
            - application/octet-stream
            type: file
          inputFile:
            title: Molecules to predict (.sdf or .smi)
            mime-types:
            - chemical/x-mdl-sdfile
            - squonk/x-smiles
            - chemical/x-daylight-smiles
            type: file
          probesFile:
            title: Probe molecules with expected predictions (.csv)
            description: >-
              Columns smiles, prediction and optionally score (probability or
              decision score of a binary classifier). The model is rejected if
              it doesn't reproduce them.
            mime-types:
            - text/csv
            type: file
      outputs:
        type: object
        properties:
          outputFile:
            title: Output file
            mime-types:
            - text/csv
            creates: '{{ outputFile }}'
            type: file
      options:
        type: object
        required:
        - outputFile
        properties:
          outputFile:
            title: Output file
            type: string
            pattern: "^[A-Za-z0-9_/\\.\\-]+$"
            default: predictions.csv
          delimiter:
            title: Delimiter of a SMILES input file
            type: string
            enum:
            - tab
            - space
            - comma
            - semicolon
            default: tab
          readHeader:
            title: SMILES input file has a header line
            type: boolean
            default: false
