[tool.poetry]
name = "squonk2-predictor"
version = "0.1.0"
description = "Squonk2 job that predicts values for molecules using a pre-trained scikit-learn model"
authors = [
  "Tim Dudgeon <tdudgeon@informaticsmatters.com>",
  "Kalev Takkis <ktakkis@informaticsmatters.com>",
]
readme = "README.md"

[tool.poetry.dependencies]
# This branch runs scikit-learn 1.2.2 for tree models saved before
# scikit-learn 1.3, which later versions can't read; see "Job versions" in
# README.md. scikit-learn 1.2.2 has no wheels beyond Python 3.11.
python = ">=3.11,<3.12"
# the job no longer computes descriptors, so rdkit is only used to read SDF
# descriptor files; its version no longer affects results and this pin can be
# relaxed later
rdkit = "2023.9.6"
numpy = "^1.26.4"
scikit-learn = "1.2.2"
pandas = "^2.3.3"
im-data-manager-job-utilities = "^1.4.1"

[tool.poetry.group.dev.dependencies]
im-jote = "^0.14.0"
pre-commit = "^4.7.0"
pylint = "^4.1.3"
isort = "^9.0.2"
black = "^26.10.1"
mypy = "^2.4.1"
ipython = "^9.18.0"
pytest = "^9.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
