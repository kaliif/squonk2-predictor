---
kind: DataManagerJobDefinition
kind-version: '2021.1'

name: Predictions with user-supplied scikit-learn models
collection: im-virtual-screening

jobs:

  predict:
    name: Predict with your model
    description: >-
      Predicts values for molecules using a pre-trained scikit-learn model
      that you supply. The descriptors the model was trained on are
      calculated for the molecules.
    version: '1.0.0'
    category: predictive models
    keywords:
    - predictive models
    - predict
    - scikit-learn
    - jaqpot
    image:
      name: kaliif/squonk2-predictor
      tag: latest
      project-directory: /data
      working-directory: /data
      fix-permissions: true
    command: >-
      python /code/predict.py
      --model '{{ modelFile }}'
      --molecules '{{ inputFile }}'
      --outfile '{{ outputFile }}'
      {% if delimiter is defined %}--delimiter {{ delimiter }}{% endif %}
      {% if readHeader is defined and readHeader %}--read-header{% endif %}
    variables:
      order:
        options:
        - outputFile
        - delimiter
        - readHeader
      inputs:
        type: object
        required:
        - modelFile
        - inputFile
        properties:
          modelFile:
            title: Model (.jmodel)
            mime-types:
            - application/octet-stream
            type: file
          inputFile:
            title: Molecules to predict (.sdf or .smi)
            mime-types:
            - chemical/x-mdl-sdfile
            - squonk/x-smiles
            - chemical/x-daylight-smiles
            type: file
      outputs:
        type: object
        properties:
          outputFile:
            title: Predictions
            mime-types:
            - text/csv
            creates: '{{ outputFile }}'
            type: file
      options:
        type: object
        required:
        - outputFile
        properties:
          outputFile:
            title: Output file name (.csv)
            type: string
            pattern: "^[A-Za-z0-9_/\\.\\-]+$"
            default: predictions.csv
          delimiter:
            title: Delimiter of a SMILES input file
            type: string
            enum:
            - tab
            - space
            - comma
            - semicolon
            - pipe
            default: tab
          readHeader:
            title: SMILES input file has a header line
            type: boolean
            default: false
    tests:
      sdf:
        inputs:
          modelFile: data/models/CYP2D6_Veith.jmodel
          inputFile: data/candidates-10.sdf
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      smiles:
        inputs:
          modelFile: data/models/clearance_hepatocyte_az.jmodel
          inputFile: data/10.smi
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      smiles-with-invalid-molecule:
        inputs:
          modelFile: data/models/CYP2D6_Veith.jmodel
          inputFile: data/10-error.smi
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      sdf-with-invalid-molecule:
        inputs:
          modelFile: data/models/clearance_hepatocyte_az.jmodel
          inputFile: data/candidates-10-error.sdf
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      mordred:
        inputs:
          modelFile: data/models/dili-3trees.jmodel
          inputFile: data/candidates-10.sdf
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      bare-estimator-rejected:
        inputs:
          modelFile: data/models/bare-estimator.pkl
          inputFile: data/10.smi
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 1
          outputs:
          - name: predictions.csv
            checks:
            - exists: false
