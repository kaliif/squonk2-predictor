[tool.poetry]
name = "squonk2-predict-local"
version = "0.1.0"
description = "Squonk2 job that predicts values for molecules using a pre-trained scikit-learn model"
authors = [
  "Tim Dudgeon <tdudgeon@informaticsmatters.com>",
  "Kalev Takkis <ktakkis@informaticsmatters.com>",
]
readme = "README.md"

[tool.poetry.dependencies]
# Python, rdkit, numpy and mordred are held back by the legacy jaqpotpy
# models: later rdkit releases change descriptors they were trained on,
# rdkit 2023.9.6 has no wheels beyond Python 3.12 and is built against
# numpy 1, and mordred 1.2.0 doesn't import with numpy 2.
python = ">=3.12,<3.13"
rdkit = "2023.9.6"
numpy = "^1.26.4"
# trees pickled by scikit-learn < 1.4 are converted on loading, see
# safe_loader.py
scikit-learn = "1.9.1"
pandas = "^2.3.3"
# the original mordred, not mordredcommunity: jaqpotpy 1.0.x models were
# trained with it, and mordredcommunity perceives rings differently, which
# changes ring counts and descriptors derived from them
mordred = "1.2.0"
# mordred 1.2.0 imports distutils, which Python 3.12 provides only through
# setuptools
setuptools = "*"
im-data-manager-job-utilities = "^1.4.1"

[tool.poetry.group.dev.dependencies]
im-jote = "^0.14.0"
pre-commit = "^4.7.0"
pylint = "^4.1.3"
isort = "^9.0.2"
black = "^26.10.1"
mypy = "^2.4.1"
ipython = "^9.18.0"
pytest = "^9.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    # mordred 1.2.0 is old; its deprecation warnings are noise
    "ignore::DeprecationWarning:mordred.*",
]
