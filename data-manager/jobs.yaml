---
kind: DataManagerJobDefinition
kind-version: '2021.1'

name: Predictions with user-supplied scikit-learn models
collection: im-virtual-screening

jobs:

  predict:
    name: Predict with your model (scikit-learn 1.9)
    description: >-
      Predicts values for molecules using a pre-trained scikit-learn model that
      you supply, from descriptors already calculated by a descriptor job. The
      descriptor file's manifest (JSON) describes the featurizer, its
      parameters, the library versions and the fragment method; the job refuses
      the file if the featurizer or its parameters don't match the model. This
      version runs scikit-learn 1.9.1. It can't read tree models (e.g. random
      forests) saved with scikit-learn before 1.3; use job version 1.0.1 for
      those.
    version: '1.1.0'
    category: predictive models
    keywords:
    - predictive models
    - predict
    - scikit-learn
    - jaqpot
    - descriptors
    image:
      name: kaliif/squonk2-predictor
      tag: latest
      project-directory: /data
      working-directory: /data
      fix-permissions: true
    command: >-
      python /code/predict.py
      --model '{{ modelFile }}'
      --descriptors '{{ descriptorsFile }}'
      --manifest '{{ manifestFile }}'
      --outfile '{{ outputFile }}'
      {% if delimiter is defined %}--delimiter {{ delimiter }}{% endif %}
    variables:
      order:
        options:
        - outputFile
        - delimiter
      inputs:
        type: object
        required:
        - modelFile
        - descriptorsFile
        - manifestFile
        properties:
          modelFile:
            title: Model (.jmodel)
            mime-types:
            - application/octet-stream
            type: file
          descriptorsFile:
            title: Precomputed descriptors (.smi, .csv or .sdf)
            mime-types:
            - squonk/x-smiles
            - chemical/x-daylight-smiles
            - text/csv
            - chemical/x-mdl-sdfile
            type: file
          manifestFile:
            title: Descriptor manifest (.json)
            mime-types:
            - application/json
            type: file
      outputs:
        type: object
        properties:
          outputFile:
            title: Predictions
            mime-types:
            - text/csv
            creates: '{{ outputFile }}'
            type: file
      options:
        type: object
        required:
        - outputFile
        properties:
          outputFile:
            title: Output file name (.csv)
            type: string
            pattern: "^[A-Za-z0-9_/\\.\\-]+$"
            default: predictions.csv
          delimiter:
            title: Delimiter of a text descriptor file
            type: string
            enum:
            - tab
            - space
            - comma
            - semicolon
            - pipe
            default: tab
    tests:
      morgan:
        inputs:
          modelFile: data/models/CYP2D6_Veith.jmodel
          descriptorsFile: data/descriptors/cyp2d6-morgan.smi
          manifestFile: data/descriptors/cyp2d6-morgan.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      maccs:
        inputs:
          modelFile: data/models/clearance_hepatocyte_az.jmodel
          descriptorsFile: data/descriptors/clearance-maccs.smi
          manifestFile: data/descriptors/clearance-maccs.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      sdf:
        inputs:
          modelFile: data/models/clearance_hepatocyte_az.jmodel
          descriptorsFile: data/descriptors/clearance-maccs.sdf
          manifestFile: data/descriptors/clearance-maccs-sdf.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      featurizer-mismatch-rejected:
        inputs:
          modelFile: data/models/CYP2D6_Veith.jmodel
          descriptorsFile: data/descriptors/clearance-maccs.smi
          manifestFile: data/descriptors/clearance-maccs.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 1
          outputs:
          - name: predictions.csv
            checks:
            - exists: false
      bare-estimator-rejected:
        inputs:
          modelFile: data/models/bare-estimator.pkl
          descriptorsFile: data/descriptors/clearance-maccs.smi
          manifestFile: data/descriptors/clearance-maccs.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 1
          outputs:
          - name: predictions.csv
            checks:
            - exists: false
      sklearn-19-model:
        inputs:
          modelFile: data/models/rf-maccs-sklearn-1.9.1.jmodel
          descriptorsFile: data/descriptors/clearance-maccs.smi
          manifestFile: data/descriptors/clearance-maccs.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 0
          outputs:
          - name: predictions.csv
            checks:
            - exists: true
            - lineCount: 11
      sklearn-12-model-rejected:
        inputs:
          modelFile: data/models/rf-maccs-sklearn-1.2.2.jmodel
          descriptorsFile: data/descriptors/clearance-maccs.smi
          manifestFile: data/descriptors/clearance-maccs.manifest.json
        options:
          outputFile: predictions.csv
        checks:
          exitCode: 1
          outputs:
          - name: predictions.csv
            checks:
            - exists: false
